# --- Site Identity & URLs --- #
url: "https://xuyanwu.github.io"
baseurl: ""

title: "Yanwu Xu"
description: "Senior Software Engineer & Researcher working on efficient and on-device generative AI."
title-separator: "·"

# --- Navigation bar options --- #
navbar-links:
  Home: ""
  Work & Products: "#featured-work"
  Publications: "publications/"
  Experience: "#experience"
  Patents: "#patents"
  Resume: "Resume_Yanwu_Xu.pdf"

avatar: "/img/yanwu-gear2.jpg"

# --- Author & Social --- #
author:
  name: "Yanwu Xu"
  github: "xuyanwu"
  scholar: "https://scholar.google.com/citations?user=NOEyacoAAAAJ&hl=en"

footer-links-active:
  rss: false
  facebook: false
  email: false
  twitter: false
  google-plus: false
  github: true
  reddit: false
  linkedin: false
  xing: false
  stackoverflow: false
  snapchat: false
  instagram: false
  youtube: false
  spotify: false
  telephone: false
  scholar: true

share-links-active:
  twitter: false
  facebook: false
  google: false
  linkedin: false

excerpt_length: 50

# --- Build & Timezone --- #
timezone: "America/Los_Angeles"
markdown: kramdown
highlighter: rouge
permalink: /:year-:month-:day-:title/

kramdown:
  input: GFM

defaults:
  -
    scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      comments: false
      social-share: false
  -
    scope:
      path: ""
    values:
      layout: "page"
      show-avatar: true

link-tags: false

exclude:
  - CHANGELOG.md
  - CNAME
  - Dockerfile
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - Vagrantfile
